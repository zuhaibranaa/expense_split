version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: settleup-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=sqlite:///./settleup.db
    restart: unless-stopped
  
  mailpit:
    image: axllent/mailpit
    container_name: settleup-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
